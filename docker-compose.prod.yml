services:
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - api
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://app.${DOMAIN:?Set DOMAIN in .env}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    environment:
      BACKEND_API_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: https://app.${DOMAIN}
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://csv_blog_generator:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/csv_blog_generator
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/media
      MEDIA_BASE_URL: https://api.${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://app.${DOMAIN}
    command: ["sh", "/app/scripts/start-api.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - backend_media:/app/media

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://csv_blog_generator:${POSTGRES_PASSWORD}@db:5432/csv_blog_generator
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/media
      MEDIA_BASE_URL: https://api.${DOMAIN}
    command: ["sh", "/app/scripts/start-worker.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - backend_media:/app/media

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: csv_blog_generator
      POSTGRES_USER: csv_blog_generator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csv_blog_generator -d csv_blog_generator"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  backend_media:
  caddy_data:
  caddy_config:
